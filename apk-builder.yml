name: Build Android APK

# Builds an installable HabitFlow APK on GitHub's runners — no Android Studio.
#
# How to use:  Actions → "Build Android APK" → Run workflow → download the
# "habitflow-debug-apk" artifact when it's green (~5 min).
#
# Your live server (https://habit-tracker-1-6o5t.onrender.com) is BOTH the
# default below and the value in mobile/capacitor.config.json, so every build
# points at it automatically. Only type something else in the server_url box
# for local Wi-Fi testing against your own PC (e.g. http://192.168.1.25:3000).

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: >-
          Server URL baked into the app. Leave the default (Render) for normal
          use; use http://YOUR-PC-IP:3000 only for local Wi-Fi testing.
        required: false
        default: "https://habit-tracker-1-6o5t.onrender.com"
        type: string
  push:
    paths:
      - mobile/**
      - .github/workflows/android-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 7's capacitor-android compiles with Java 21; the runner's
      # default JDK is 17 and fails with "invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bake server URL into the app
        if: ${{ inputs.server_url != '' }}
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          node -e '
            const fs = require("fs");
            let url = String(process.env.SERVER_URL || "").trim();
            if (!url) { console.log("No server_url given — keeping mobile/capacitor.config.json value."); process.exit(0); }
            if (!/^https?:\/\//i.test(url)) url = "https://" + url;   // tolerate missing protocol
            url = url.replace(/\/+$/, "");                             // strip trailing slashes
            const cfgPath = "mobile/capacitor.config.json";
            const cfg = JSON.parse(fs.readFileSync(cfgPath, "utf8"));
            cfg.server.url = url;
            if (url.startsWith("https://")) delete cfg.server.cleartext;  // cleartext only needed for http
            fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + "\n");
            const htmlPath = "mobile/www/index.html";
            const html = fs.readFileSync(htmlPath, "utf8")
              .replace(/var SERVER_URL = '"'"'[^'"'"']*'"'"';/, "var SERVER_URL = '" + url + "';");
            fs.writeFileSync(htmlPath, html);
            console.log("Baked server.url →", url);
          '

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Capacitor sync (Android)
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK (installable on any Android device)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Report APK size
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          SIZE=$(du -h "$APK" | cut -f1)
          echo "habitflow-debug.apk size: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          cp "$APK" habitflow-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitflow-debug-apk
          path: habitflow-debug.apk
          retention-days: 30
