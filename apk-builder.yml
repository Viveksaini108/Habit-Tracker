name: Build Android APK

# ─────────────────────────────────────────────────────────────────────────────
# ONE-STEP ACTIVATION (repo owner):
#   move this file to  .github/workflows/android-apk.yml  and push.
#   Locally:   mkdir -p .github/workflows; git mv apk-builder.yml .github/workflows/android-apk.yml; git push
#   GitHub UI: open this file → copy → repo root → Add file → create new file
#              named .github/workflows/android-apk.yml → paste → commit.
# (The Arena bot's credentials can't create workflow files — yours can.)
#
# What it does once active:
#   • Actions → "Build Android APK" → Run workflow — optionally type your server
#     URL (e.g. http://192.168.1.25:3000) to bake it into the app
#   • also auto-builds on every push that touches mobile/**
#   • uploads  habitflow-debug.apk  as a downloadable run artifact + logs its size
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: >-
          HabitFlow server URL to bake into the app (e.g. http://192.168.1.25:3000).
          Leave empty to keep the value from mobile/capacitor.config.json.
        required: false
        type: string
  push:
    paths:
      - mobile/**
      - .github/workflows/android-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 7's capacitor-android compiles with Java 21; the runner's
      # default JDK is 17 and fails with "invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bake custom server URL into the app (optional)
        if: ${{ inputs.server_url != '' }}
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.SERVER_URL;
            const cfgPath = "mobile/capacitor.config.json";
            const cfg = JSON.parse(fs.readFileSync(cfgPath, "utf8"));
            cfg.server.url = url;
            fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + "\n");
            const htmlPath = "mobile/www/index.html";
            const html = fs.readFileSync(htmlPath, "utf8")
              .replace(/var SERVER_URL = '"'"'[^'"'"']*'"'"';/, "var SERVER_URL = '" + url + "';");
            fs.writeFileSync(htmlPath, html);
            console.log("Baked server.url →", url);
          '

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Capacitor sync (Android)
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK (installable on any Android device)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Report APK size
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          SIZE=$(du -h "$APK" | cut -f1)
          echo "habitflow-debug.apk size: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          cp "$APK" habitflow-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitflow-debug-apk
          path: habitflow-debug.apk
          retention-days: 30
